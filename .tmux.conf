set -g mouse on

unbind C-b

unbind-key -n M-j
unbind-key -n M-k

set -sg escape-time 0

set -g base-index 1
setw -g pane-base-index 1

bind-key -n M-h previous-window
bind-key -n M-l next-window

bind-key -n M-u swap-window -t -1 \; previous-window
bind-key -n M-i swap-window -t +1 \; next-window

bind-key -n M-v split-window -h
bind-key -n M-s split-window -v

bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key -n M-t new-window
bind-key -n M-w kill-window
bind-key -n M-r command-prompt "rename-window '%%'"
bind-key -n M-q detach-client

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#111111,fg=#888888"
set -g status-left ""
set -g status-right "#[fg=#666666]%H:%M"
set -g window-status-separator ""
set -g window-status-format " #[fg=#666666,bg=#1a1a1a] #I #[fg=#999999,bg=#1a1a1a]#W #[default]"
set -g window-status-current-format " #[bold,fg=#000000,bg=#a6e3a1] #I #[bold,fg=#000000,bg=#a6e3a1]#W #[default]"
set -g window-status-current-style ""
set -g window-status-style ""
set -g status-interval 1
