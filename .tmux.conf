# Mouse support enabled
set -g mouse on
# Renumber windows when a window is closed
set -g renumber-windows on

# Unbind default Ctrl-b prefix
unbind C-b

# Unbind Alt-j and Alt-k (reserved for other tools)
unbind-key -n M-j
unbind-key -n M-k

# Remove delay for escape key
set -sg escape-time 0

# Start window numbering at 1
set -g base-index 1
# Start pane numbering at 1
setw -g pane-base-index 1

# Alt+h: Go to previous window
bind-key -n M-h previous-window
# Alt+l: Go to next window
bind-key -n M-l next-window

# Alt+u: Swap window with previous and move to it
bind-key -n M-u swap-window -t -1 \; previous-window
# Alt+i: Swap window with next and move to it
bind-key -n M-i swap-window -t +1 \; next-window

# Alt+v: Split window vertically (left/right panes)
bind-key -n M-v split-window -h
# Alt+s: Split window horizontally (top/bottom panes)
bind-key -n M-s split-window -v

# Alt+Left: Select pane on the left
bind-key -n M-Left  select-pane -L
# Alt+Right: Select pane on the right
bind-key -n M-Right select-pane -R
# Alt+Up: Select pane above
bind-key -n M-Up    select-pane -U
# Alt+Down: Select pane below
bind-key -n M-Down  select-pane -D

# Ctrl+Shift+Left: Resize pane left by 5 cells
bind-key -n C-S-Left  resize-pane -L 5
# Ctrl+Shift+Right: Resize pane right by 5 cells
bind-key -n C-S-Right resize-pane -R 5
# Ctrl+Shift+Up: Resize pane up by 5 cells
bind-key -n C-S-Up    resize-pane -U 5
# Ctrl+Shift+Down: Resize pane down by 5 cells
bind-key -n C-S-Down  resize-pane -D 5

# Alt+1: Select window 1
bind-key -n M-1 select-window -t 1
# Alt+2: Select window 2
bind-key -n M-2 select-window -t 2
# Alt+3: Select window 3
bind-key -n M-3 select-window -t 3
# Alt+4: Select window 4
bind-key -n M-4 select-window -t 4
# Alt+5: Select window 5
bind-key -n M-5 select-window -t 5
# Alt+6: Select window 6
bind-key -n M-6 select-window -t 6
# Alt+7: Select window 7
bind-key -n M-7 select-window -t 7
# Alt+8: Select window 8
bind-key -n M-8 select-window -t 8
# Alt+9: Select window 9
bind-key -n M-9 select-window -t 9

# Alt+t: Create new window
bind-key -n M-t new-window
# Alt+w: Kill current window (with confirmation)
bind-key -n M-w confirm-before "kill-window"
# Alt+r: Rename current window
bind-key -n M-r command-prompt "rename-window '%%'"
# Alt+q: Detach from tmux session
bind-key -n M-q detach-client

# Position status bar at bottom
set -g status-position bottom
# Align status bar to left
set -g status-justify left
# Status bar colors
set -g status-style "bg=#111111,fg=#888888"
# No left status
set -g status-left ""
# Right status: time
set -g status-right "#[fg=#666666]%H:%M"
# No separator between windows
set -g window-status-separator ""
# Window format (inactive)
set -g window-status-format " #[fg=#666666,bg=#1a1a1a] #I #[fg=#999999,bg=#1a1a1a]#W #[default]"
# Window format (active)
set -g window-status-current-format " #[bold,fg=#000000,bg=#a6e3a1] #I #[bold,fg=#000000,bg=#a6e3a1]#W #[default]"
# Window current style
set -g window-status-current-style ""
# Window style
set -g window-status-style ""
# Status bar refresh interval (seconds)
set -g status-interval 1
